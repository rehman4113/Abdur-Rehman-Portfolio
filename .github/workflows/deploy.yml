name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert profile image to WebP
        if: ${{ !contains(github.event.head_commit.message, '[skip image conversion]') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          cwebp -q 82 -resize 960 0 "public/assets/about pic 1.jpg" -o public/assets/profile.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/profile.webp
          git commit -m "Add optimized profile WebP [skip image conversion]"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - name: Build React application
        run: npm run build
      - name: Add SPA fallback for case study route
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
